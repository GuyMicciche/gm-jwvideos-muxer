trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  githubRepoUrl: 'https://github.com/GuyMicciche/jwmediaconverter' 

steps:
- checkout: none

- script: |
    git init
    git remote add origin $(githubRepoUrl)
    git fetch origin main
    git checkout -b main origin/main
  displayName: 'Fetch from GitHub'

- script: |
    # Use System.AccessToken (no PAT needed)
    export B64_PAT=$(printf ":$(System.AccessToken)" | base64)
    git -c http.extraheader="Authorization: Basic ${B64_PAT}" remote add azure https://dev.azure.com/kingguy/jwmediaconverter/_git/jwmediaconverter
    git -c http.extraheader="Authorization: Basic ${B64_PAT}" push azure main --force
  displayName: 'Push to Azure DevOps'
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)