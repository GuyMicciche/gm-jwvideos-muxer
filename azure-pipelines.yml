# Step 1: Make sure you have a Personal Access Token (PAT) created in Azure DevOps with appropriate permissions to push to the repository.
# Step 2: Store this PAT as a secret in your Azure DevOps pipeline settings (e.g., AZURE_DEVOPS_PAT).
# Step 3: Use the following YAML pipeline configuration to push code from GitHub to Azure

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  githubRepoUrl: 'https://github.com/GuyMicciche/jwmediaconverter' 

steps:
- checkout: none

- script: |
    git init
    git remote add origin $(githubRepoUrl)
    git fetch origin main
    git checkout -b main origin/main
  displayName: 'Fetch from GitHub'

- script: |
    git remote add azure https://$(AZURE_DEVOPS_PAT)@dev.azure.com/guymicciche/jwmediaconverter/_git/jwmediaconverter
    git push azure main --force
  displayName: 'Push to Azure DevOps'
  env:
    AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)

